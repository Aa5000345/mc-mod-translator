[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-mod-translator"
version = "0.1.0"
description = "Minecraft mod automatic translation tool"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "loguru>=0.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
local = ["transformers>=4.40", "sentencepiece", "torch"]
dev = ["pytest", "pytest-asyncio", "pyinstaller"]

[project.scripts]
mcmt = "mc_mod_translator.cli:app"
mcmt-gui = "mc_mod_translator.gui.main:main"

[tool.setuptools.packages.find]
include = ["mc_mod_translator*"]