[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-mod-translator"
version = "0.3.0"
description = "Minecraft mod automatic translation tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MC Mod Translator contributors" }]
keywords = ["minecraft", "mod", "translation", "i18n"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "loguru>=0.7",
    "cryptography>=42.0",
    "certifi>=2024.0",
    "truststore>=0.9; python_version >= '3.10'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
local = ["transformers>=4.40", "sentencepiece", "torch"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
mcmt = "mc_mod_translator.cli:app"
mcmt-gui = "mc_mod_translator.gui.main:main"

[project.urls]
Homepage = "https://github.com/your-name/mc-mod-translator"
Issues = "https://github.com/your-name/mc-mod-translator/issues"

[tool.setuptools.packages.find]
include = ["mc_mod_translator*"]
exclude = [
    "mc_mod_translator.tests",
    "mc_mod_translator.tests.*",
]

[tool.pytest.ini_options]
testpaths = ["mc_mod_translator/tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]