name: Build Dev

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MCModTranslator-Windows
            asset_name: MCModTranslator.exe
          - os: ubuntu-latest
            artifact_name: MCModTranslator-Linux
            asset_name: MCModTranslator
          - os: macos-latest
            artifact_name: MCModTranslator-macOS
            asset_name: MCModTranslator

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed `
            --name "MCModTranslator" `
            --icon icon.ico `
            --add-data "icon.ico;." `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtSvg `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module tkinter `
            --exclude-module transformers `
            --exclude-module torch `
            --noconfirm --clean `
            launcher.py

      - name: Build with PyInstaller (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile \
            --name "MCModTranslator" \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtSvg \
            --exclude-module PyQt5 \
            --exclude-module PyQt6 \
            --exclude-module tkinter \
            --exclude-module transformers \
            --exclude-module torch \
            --noconfirm --clean \
            launcher.py

      - name: Rename executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item "dist/MCModTranslator.exe" "dist/${{ matrix.asset_name }}"

      - name: Rename executable (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mv "dist/MCModTranslator" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 30
