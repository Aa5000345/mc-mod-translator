name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libdbus-1-3

      - name: Install dependencies
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Run tests
        run: pytest -v

  build-windows:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller

      - name: Download UPX
        shell: pwsh
        run: |
          $url = "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile upx.zip -UseBasicParsing
          Expand-Archive -Path upx.zip -DestinationPath upx-dir
          Move-Item "upx-dir\upx-4.2.4-win64" "upx"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --upx-dir upx MCModTranslator.spec

      - name: Report size
        shell: pwsh
        run: |
          $size = (Get-Item "dist\MCModTranslator.exe").Length / 1MB
          Write-Host ("EXE 大小: {0:N2} MB" -f $size)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCModTranslator-Windows
          path: dist/MCModTranslator.exe
          retention-days: 7

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MCModTranslator-Windows
          path: release-assets

      - name: List downloaded files
        run: find release-assets -type f

      - name: Detect prerelease
        id: detect
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          is_pre=false
          case "$tag" in
            *-beta*|*-alpha*|*-rc*) is_pre=true ;;
          esac
          echo "is_prerelease=$is_pre" >> "$GITHUB_OUTPUT"
          echo "tag=$tag is_prerelease=$is_pre"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.detect.outputs.is_prerelease == 'true' }}
          files: release-assets/MCModTranslator.exe